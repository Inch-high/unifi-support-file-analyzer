name: tests

# Runs on every push and every pull request, so branch protection has a real
# check to require rather than a nominal one.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool claims to run on all three, so all three are tested. The
        # oldest supported Python is included because the code targets 3.9.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
        exclude:
          - os: macos-latest
            python: '3.9'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # For the browser code. The runners ship a Node already, but which one
      # is not this repository's decision to leave to chance.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip -r requirements.txt

      - name: Check every module imports
        run: python -c "import analyzer.app; print('imports ok')"

      # Everything else here imports the package directly, so nothing ever
      # ran the program the way a person does. That is how a launcher that
      # could not enter its own virtual environment on macOS and Linux
      # shipped: the suites all passed on the three platforms it was broken
      # on. This starts it exactly as the README says to.
      - name: Start the way the README says to
        run: python run.py --check

      - name: Archive extraction and path containment
        run: python tests/test_bundle.py

      - name: Encoding is not left to the platform
        run: python tests/test_encoding.py

      - name: Firmware manifest
        run: python tests/test_firmware.py

      - name: Process audit
        run: python tests/test_procaudit.py

      - name: Log integrity
        run: python tests/test_tamper.py

      - name: Privacy scan
        run: python tests/test_pii.py

      - name: Network analysis
        run: python tests/test_lan.py

      - name: Sanitised export
        run: python tests/test_sanitise.py

      - name: Retention summary
        run: python tests/test_coverage.py

      # The first test of the browser half of this tool. It loads the real
      # static/app.js, so a change there is checked here rather than only in
      # whatever the person making it happened to click on.
      - name: History tab
        run: node tests/test_history_view.js

      - name: Privacy tab, and where a slow result lands
        run: node tests/test_privacy_view.js
