name: docker

# Every pull request builds the image and runs it, so a change that breaks
# start-up is caught before it lands. Pushes to master and version tags publish
# to the GitHub Container Registry as well.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/inch-high/unifi-support-file-analyzer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emulation, so the arm64 image can be built on an x86 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Built for this runner's architecture first and loaded locally, because
      # a multi-architecture build stays in the builder and cannot be run. The
      # push below reuses every layer from this build through the cache.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: unifi-support-file-analyzer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it
        run: |
          chmod +x docker/smoke-test.sh
          docker/smoke-test.sh unifi-support-file-analyzer:test

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # arm64 as well as amd64: a lot of the people who own a UniFi console
      # also have a Raspberry Pi or an ARM NAS to run this on.
      - name: Build and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
